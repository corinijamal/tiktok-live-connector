<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ساحة المعركة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --void: #0a0612;
    --void-2: #140b24;
    --ember: #ff3d5a;
    --lime: #baff29;
    --gold: #ffb020;
    --violet: #7b3ff2;
    --violet-glow: #a869ff;
    --ice: #e9e4ff;
    --dim: #6b6284;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--void);
    color: var(--ice);
    font-family: 'Tajawal', sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, rgba(123, 63, 242, 0.35), transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 110%, rgba(255, 61, 90, 0.18), transparent 60%),
      var(--void);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    z-index: 20;
  }

  .brand {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: var(--ice);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 12px var(--ember);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .round-chip {
    background: linear-gradient(135deg, var(--violet), #4c1fb0);
    border-radius: 999px;
    padding: 8px 20px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 4px 20px rgba(123, 63, 242, 0.5);
  }

  .timer {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255, 176, 32, 0.6);
    font-variant-numeric: tabular-nums;
  }
  .timer.urgent { color: var(--ember); text-shadow: 0 0 24px rgba(255, 61, 90, 0.8); }

  /* ---------- Arena ---------- */
  .arena-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arena {
    position: relative;
    width: min(88vmin, 720px);
    height: min(88vmin, 720px);
    border-radius: 50%;
    border: 2px solid rgba(168, 105, 255, 0.35);
    background:
      repeating-radial-gradient(circle, rgba(168,105,255,0.05) 0px, rgba(168,105,255,0.05) 1px, transparent 1px, transparent 46px),
      radial-gradient(circle at 50% 50%, rgba(123,63,242,0.12), transparent 70%);
    box-shadow:
      0 0 0 1px rgba(168,105,255,0.1),
      0 0 80px rgba(123,63,242,0.25) inset,
      0 0 120px rgba(123,63,242,0.15);
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-size: cover;
    background-position: center;
    border: 3px solid var(--violet-glow);
    box-shadow: 0 0 14px rgba(168, 105, 255, 0.55);
    transform: translate(-50%, -50%);
    transition: width 0.25s ease, height 0.25s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    will-change: left, top;
  }
  .bubble.boosted {
    border-color: var(--ember);
    box-shadow: 0 0 22px rgba(255, 61, 90, 0.85), 0 0 6px rgba(255,61,90,0.9);
  }
  .bubble .name-tag {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    color: var(--ice);
    background: rgba(10, 6, 18, 0.75);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bubble .score-tag {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--gold);
  }
  .bubble .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 16px;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
  }
  .bubble .initial {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }

  .float-num {
    position: absolute;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 18px;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 30;
  }
  .float-num.plus { color: var(--lime); text-shadow: 0 0 8px rgba(186,255,41,0.7); }
  .float-num.minus { color: var(--ember); text-shadow: 0 0 8px rgba(255,61,90,0.7); }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -60px); }
  }

  /* ---------- Leaderboard ---------- */
  .leaderboard {
    position: absolute;
    top: 90px;
    left: 24px;
    width: 220px;
    background: rgba(20, 11, 36, 0.7);
    border: 1px solid rgba(168, 105, 255, 0.25);
    border-radius: 16px;
    padding: 14px;
    backdrop-filter: blur(8px);
    z-index: 20;
  }
  .leaderboard h3 {
    margin: 0 0 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    font-size: 13px;
  }
  .lb-rank {
    width: 18px;
    color: var(--dim);
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
  }
  .lb-avatar {
    width: 24px; height: 24px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    border: 1px solid rgba(168,105,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lb-initial {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.9);
  }
  .lb-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-score {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    color: var(--lime);
  }

  /* ---------- Join hint ---------- */
  .join-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 11, 36, 0.8);
    border: 1px solid rgba(255, 176, 32, 0.4);
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    color: var(--gold);
    z-index: 20;
  }
  .join-hint b { color: var(--ice); }

  /* ---------- Winner overlay ---------- */
  .winner-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 6, 18, 0.85);
    backdrop-filter: blur(6px);
    z-index: 50;
    flex-direction: column;
    gap: 16px;
  }
  .winner-overlay.show { display: flex; }
  .winner-avatar {
    width: 140px; height: 140px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 4px solid var(--gold);
    box-shadow: 0 0 50px rgba(255, 176, 32, 0.6);
  }
  .winner-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .winner-name {
    font-size: 26px;
    font-weight: 900;
  }
  .winner-score {
    font-family: 'Rajdhani', sans-serif;
    font-size: 18px;
    color: var(--lime);
  }

  /* ---------- Admin panel ---------- */
  .admin {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: rgba(20, 11, 36, 0.85);
    border: 1px solid rgba(168, 105, 255, 0.3);
    border-radius: 14px;
    padding: 14px;
    width: 240px;
    z-index: 60;
    font-size: 13px;
  }
  .admin h4 { margin: 0 0 10px; font-size: 13px; color: var(--dim); font-weight: 700; }
  .admin input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(168,105,255,0.3);
    background: rgba(255,255,255,0.05);
    color: var(--ice);
    margin-bottom: 8px;
    font-family: 'Tajawal', sans-serif;
  }
  .admin button {
    width: 100%;
    padding: 9px;
    border-radius: 8px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 6px;
    font-family: 'Tajawal', sans-serif;
    transition: opacity 0.15s;
  }
  .admin button:hover { opacity: 0.85; }
  .btn-connect { background: var(--violet); color: white; }
  .btn-start { background: var(--lime); color: #0a0612; }
  .btn-stop { background: var(--ember); color: white; }
  .admin .status { font-size: 11px; color: var(--dim); margin-top: 4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> ساحة المعركة</div>
    <div class="round-chip" id="roundChip">الجولة 0</div>
    <div class="timer" id="timer">03:00</div>
  </div>

  <div class="leaderboard">
    <h3>الأعلى نقاطًا</h3>
    <div id="lbList"></div>
  </div>

  <div class="arena-wrap">
    <div class="arena" id="arena"></div>
  </div>

  <div class="join-hint">اكتب <b>"انضم"</b> في التعليقات للدخول إلى المعركة 🔥</div>

  <div class="winner-overlay" id="winnerOverlay">
    <div class="winner-avatar" id="winnerAvatar"></div>
    <div class="winner-title">🏆 الفائز بالجولة</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="winner-score" id="winnerScore"></div>
  </div>

  <div class="admin">
    <h4>لوحة التحكم</h4>
    <input id="usernameInput" placeholder="اسم المستخدم على تيك توك" />
    <button class="btn-connect" onclick="connectTikTok()">اتصال بالبث</button>
    <button class="btn-start" onclick="startGame()">بدء اللعبة</button>
    <button class="btn-stop" onclick="stopGame()">إيقاف اللعبة</button>
    <div class="status" id="statusLine">غير متصل</div>
  </div>
</div>

<script>
const socket = io();
const arena = document.getElementById('arena');
const timerEl = document.getElementById('timer');
const roundChip = document.getElementById('roundChip');
const lbList = document.getElementById('lbList');
const statusLine = document.getElementById('statusLine');
const winnerOverlay = document.getElementById('winnerOverlay');

const ARENA_RADIUS = 500; // must match server virtual units
let arenaPx = arena.clientWidth / 2;
window.addEventListener('resize', () => arenaPx = arena.clientWidth / 2);

const bubbleEls = new Map();
let roundEndsAt = 0;

function toPx(v) { return (v / ARENA_RADIUS) * arenaPx; }

function ensureBubbleEl(player) {
  let el = bubbleEls.get(player.userId);
  if (!el) {
    el = document.createElement('div');
    el.className = 'bubble';
    el.innerHTML = `
      <div class="score-tag"></div>
      <div class="name-tag"></div>
      <div class="badge"></div>
      <div class="initial"></div>
    `;
    arena.appendChild(el);
    bubbleEls.set(player.userId, el);
  }
  return el;
}

// Deterministic background color per player, used when no profile photo is
// available so the bubble still reads as "this player" rather than a blank
// circle (TikTok doesn't always send a photo URL on every event type).
function colorForName(name) {
  const palette = ['#7b3ff2', '#c9376a', '#1f8a70', '#b8860b', '#2a6f97', '#9d4edd'];
  let hash = 0;
  const str = name || '?';
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return palette[hash % palette.length];
}

function renderState(state) {
  roundChip.textContent = `الجولة ${state.roundNumber}`;
  roundEndsAt = state.roundEndsAt;

  const seen = new Set();
  state.players.forEach((p) => {
    seen.add(p.userId);
    const el = ensureBubbleEl(p);
    const cx = arenaPx + toPx(p.x);
    const cy = arenaPx + toPx(p.y);
    const size = toPx(p.radius) * 2;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.backgroundImage = p.profilePictureUrl ? `url('${p.profilePictureUrl}')` : 'none';
    el.style.backgroundColor = p.profilePictureUrl ? 'transparent' : colorForName(p.nickname);
    el.classList.toggle('boosted', p.boosted);
    el.querySelector('.score-tag').textContent = p.roundScore;
    el.querySelector('.name-tag').textContent = p.nickname || '';
    el.querySelector('.badge').textContent = p.badge || '';
    const initialEl = el.querySelector('.initial');
    initialEl.textContent = p.profilePictureUrl ? '' : (p.nickname || '?').trim().charAt(0).toUpperCase();
  });

  // remove stale bubbles
  for (const [userId, el] of bubbleEls.entries()) {
    if (!seen.has(userId)) {
      el.remove();
      bubbleEls.delete(userId);
    }
  }

  // leaderboard (top 5)
  lbList.innerHTML = state.players.slice(0, 5).map((p, i) => `
    <div class="lb-row">
      <div class="lb-rank">${i + 1}</div>
      <div class="lb-avatar" style="background-image:url('${p.profilePictureUrl || ''}'); background-color:${p.profilePictureUrl ? 'transparent' : colorForName(p.nickname)}">${p.profilePictureUrl ? '' : `<span class="lb-initial">${(p.nickname || '?').trim().charAt(0).toUpperCase()}</span>`}</div>
      <div class="lb-name">${p.nickname || ''}</div>
      <div class="lb-score">${p.roundScore}</div>
    </div>
  `).join('');
}

function spawnFloatNum(userId, amount, isPlus) {
  const el = bubbleEls.get(userId);
  if (!el) return;
  const f = document.createElement('div');
  f.className = 'float-num ' + (isPlus ? 'plus' : 'minus');
  f.textContent = (isPlus ? '+' : '-') + Math.abs(amount);
  f.style.left = el.style.left;
  f.style.top = el.style.top;
  arena.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

socket.on('state', renderState);

socket.on('event', (evt) => {
  if (evt.type === 'like') spawnFloatNum(evt.userId, evt.amount, true);
  if (evt.type === 'hit') spawnFloatNum(evt.toUserId, evt.amount, false);
});

socket.on('round:end', (data) => {
  if (!data.winner) return;
  document.getElementById('winnerAvatar').style.backgroundImage = `url('${data.winner.profilePictureUrl || ''}')`;
  document.getElementById('winnerName').textContent = data.winner.nickname || '';
  document.getElementById('winnerScore').textContent = data.winner.roundScore + ' نقطة';
  winnerOverlay.classList.add('show');
  setTimeout(() => winnerOverlay.classList.remove('show'), 4500);
});

socket.on('tiktok:connected', (d) => { statusLine.textContent = `متصل بـ @${d.username}`; });
socket.on('tiktok:disconnected', () => { statusLine.textContent = 'انقطع الاتصال'; });
socket.on('tiktok:error', (d) => { statusLine.textContent = 'خطأ: ' + d.message; });

// countdown timer
setInterval(() => {
  if (!roundEndsAt) return;
  const remaining = Math.max(0, roundEndsAt - Date.now());
  const mm = String(Math.floor(remaining / 60000)).padStart(2, '0');
  const ss = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
  timerEl.textContent = `${mm}:${ss}`;
  timerEl.classList.toggle('urgent', remaining < 30000);
}, 250);

// ---------- Admin actions ----------
function connectTikTok() {
  const username = document.getElementById('usernameInput').value.trim();
  if (!username) return;
  fetch('/api/connect', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username }),
  });
}
function startGame() { fetch('/api/start', { method: 'POST' }); }
function stopGame() { fetch('/api/stop', { method: 'POST' }); }
</script>
</body>
</html>
