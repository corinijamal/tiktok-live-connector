<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ساحة المعركة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root {
    --void: #07050d;
    --void-2: #100a1f;
    --ember: #fb4d6b;
    --lime: #a3e635;
    --gold: #fbbf24;
    --violet: #7c3aed;
    --violet-glow: #a78bfa;
    --ice: #ede9fe;
    --dim: #7a7194;
    --panel-bg: rgba(16, 10, 31, 0.78);
    --panel-border: rgba(167, 139, 250, 0.22);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--void);
    color: var(--ice);
    font-family: 'Tajawal', sans-serif;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background:
      radial-gradient(ellipse 120% 70% at 50% -10%, rgba(124, 58, 237, 0.32), transparent 62%),
      radial-gradient(ellipse 100% 55% at 50% 112%, rgba(251, 77, 107, 0.16), transparent 60%),
      var(--void);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(14px + var(--safe-t)) 16px 10px;
    z-index: 20;
    flex-wrap: wrap;
  }

  .brand {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.4px;
    color: var(--ice);
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .brand .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 10px var(--ember);
    animation: pulse 1.6s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .round-chip {
    background: linear-gradient(135deg, var(--violet), #3b1a80);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 6px 16px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
    white-space: nowrap;
  }

  .timer {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 1.5px;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(251, 191, 36, 0.55);
    font-variant-numeric: tabular-nums;
  }
  .timer.urgent { color: var(--ember); text-shadow: 0 0 22px rgba(251, 77, 107, 0.75); }

  /* ---------- Arena ---------- */
  .arena-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px;
  }

  .arena {
    position: relative;
    width: min(90vmin, 92vw, 720px);
    height: min(90vmin, 92vw, 720px);
    border-radius: 50%;
    border: 2px solid rgba(167, 139, 250, 0.3);
    background:
      repeating-radial-gradient(circle, rgba(167,139,250,0.05) 0px, rgba(167,139,250,0.05) 1px, transparent 1px, transparent 44px),
      radial-gradient(circle at 50% 50%, rgba(124,58,237,0.12), transparent 70%);
    box-shadow:
      0 0 0 1px rgba(167,139,250,0.08),
      0 0 90px rgba(124,58,237,0.22) inset,
      0 0 110px rgba(124,58,237,0.14);
    overflow: visible;
  }
  .arena::before {
    content: '';
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0%, rgba(167,139,250,0.35) 8%, transparent 16%, transparent 50%, rgba(251,77,107,0.28) 58%, transparent 66%, transparent 100%);
    animation: spin 14s linear infinite;
    opacity: 0.7;
    pointer-events: none;
    z-index: -1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bubble {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-size: cover;
    background-position: center;
    border: 3px solid var(--violet-glow);
    box-shadow: 0 0 14px rgba(167, 139, 250, 0.5);
    transform: translate(-50%, -50%);
    transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease,
                left 0.05s linear, top 0.05s linear;
    will-change: left, top;
    z-index: 5;
  }
  .bubble.eliminated {
    transition: transform 0.45s ease, opacity 0.45s ease;
    transform: translate(-50%, -50%) scale(0.2);
    opacity: 0;
  }
  .bubble .name-tag {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    color: var(--ice);
    background: rgba(7, 5, 13, 0.78);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .bubble .name-tag .kills {
    color: var(--ember);
    font-size: 10px;
  }
  .bubble .name-tag .attack-level {
    color: var(--gold);
    font-size: 10px;
  }
  .bubble .score-tag {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--gold);
  }
  .bubble .badge {
    position: absolute;
    top: -6px;
    right: -6px;
    font-size: 15px;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.6));
    z-index: 6;
  }
  .bubble .initial {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }
  .spike-layer {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
    animation: spikespin 6s linear infinite;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .spike-layer.visible { opacity: 1; }
  @keyframes spikespin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .float-num {
    position: absolute;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 17px;
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 30;
  }
  .float-num.plus { color: var(--lime); text-shadow: 0 0 8px rgba(163,230,53,0.7); }
  .float-num.minus { color: var(--ember); text-shadow: 0 0 8px rgba(251,77,107,0.7); }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -56px); }
  }

  .projectile {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff, var(--gold) 60%, transparent 100%);
    box-shadow: 0 0 12px 4px rgba(251, 191, 36, 0.8);
    pointer-events: none;
    z-index: 25;
    transform: translate(-50%, -50%);
  }
  .impact-flash {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 26;
    animation: impactPulse 0.4s ease-out forwards;
  }
  @keyframes impactPulse {
    0% { width: 10px; height: 10px; opacity: 1; }
    100% { width: 70px; height: 70px; opacity: 0; }
  }

  /* ---------- Leaderboard ---------- */
  .leaderboard {
    position: absolute;
    top: calc(76px + var(--safe-t));
    left: 14px;
    width: 188px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 10px 12px;
    backdrop-filter: blur(10px);
    z-index: 20;
    transition: padding 0.2s ease;
  }
  .leaderboard.collapsed { padding-bottom: 10px; }
  .leaderboard.collapsed #lbList { display: none; }
  .leaderboard h3 {
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.3px;
  }
  .leaderboard.collapsed h3 { margin-bottom: 0; }
  .lb-toggle-btn {
    background: none;
    border: none;
    color: var(--gold);
    font-size: 14px;
    line-height: 1;
    padding: 2px 3px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .lb-toggle-btn:active { transform: scale(0.9); }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 0;
    font-size: 12px;
  }
  .lb-rank {
    width: 14px;
    color: var(--dim);
    font-weight: 700;
    font-family: 'Rajdhani', sans-serif;
    font-size: 11px;
  }
  .lb-avatar {
    width: 22px; height: 22px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    flex-shrink: 0;
    border: 1px solid rgba(167,139,250,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lb-initial {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.9);
  }
  .lb-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-score {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    color: var(--lime);
    font-size: 12px;
  }

  /* ---------- Join hint ---------- */
  .join-hint {
    position: absolute;
    bottom: calc(18px + var(--safe-b));
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel-bg);
    border: 1px solid rgba(251, 191, 36, 0.35);
    border-radius: 16px;
    padding: 10px 22px;
    z-index: 20;
    max-width: min(92vw, 460px);
    text-align: center;
    backdrop-filter: blur(8px);
  }
  .join-hint .line-main {
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
  }
  .join-hint .line-sub {
    font-size: 11px;
    font-weight: 500;
    color: var(--dim);
    margin-top: 3px;
  }

  /* ---------- Toasts ---------- */
  .toast-stack {
    position: absolute;
    top: calc(66px + var(--safe-t));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 45;
    pointer-events: none;
    width: min(94vw, 420px);
  }
  .toast {
    background: rgba(16, 10, 31, 0.88);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 7px 16px;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
    backdrop-filter: blur(8px);
    animation: toastIn 0.25s ease, toastOut 0.3s ease 3.1s forwards;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.level { border-color: rgba(251, 191, 36, 0.5); color: var(--gold); }
  .toast.kill { border-color: rgba(251, 77, 107, 0.5); color: var(--ember); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

  /* ---------- Winner overlay ---------- */
  .winner-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(7, 5, 13, 0.86);
    backdrop-filter: blur(6px);
    z-index: 50;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
    text-align: center;
  }
  .winner-overlay.show { display: flex; }
  .winner-avatar {
    width: 130px; height: 130px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 4px solid var(--gold);
    box-shadow: 0 0 50px rgba(251, 191, 36, 0.55);
  }
  .winner-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .winner-name { font-size: 24px; font-weight: 900; }
  .winner-score { font-family: 'Rajdhani', sans-serif; font-size: 16px; color: var(--lime); }

  /* ---------- Custom confirm dialog (replaces the native browser confirm(),
     which shows the raw hosting domain and can't be styled) ---------- */
  .confirm-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(7, 5, 13, 0.75);
    backdrop-filter: blur(6px);
    z-index: 80;
    padding: 20px;
  }
  .confirm-overlay.show { display: flex; }
  .confirm-box {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 22px;
    width: min(320px, 100%);
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .confirm-message {
    font-size: 14px;
    color: var(--ice);
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .confirm-buttons { display: flex; gap: 10px; }
  .confirm-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: 9px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    transition: transform 0.1s;
  }
  .confirm-buttons button:active { transform: scale(0.96); }
  .confirm-cancel { background: transparent; color: var(--ice); border: 1px solid rgba(237,233,254,0.3) !important; }
  .confirm-ok { background: var(--ember); color: white; }

  /* ---------- Admin panel (hidden by default, toggled) ---------- */
  .fab-toggle {
    position: absolute;
    bottom: calc(18px + var(--safe-b));
    right: 16px;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: var(--panel-bg);
    color: var(--ice);
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 61;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    transition: transform 0.2s ease;
  }
  .fab-toggle:active { transform: scale(0.92); }

  .admin {
    position: absolute;
    bottom: calc(72px + var(--safe-b));
    right: 16px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 14px;
    width: min(300px, calc(100vw - 24px));
    max-height: calc(100dvh - 90px - var(--safe-t) - var(--safe-b));
    overflow-y: auto;
    z-index: 60;
    font-size: 13px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    transform: translateY(16px) scale(0.96);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.22s ease, opacity 0.22s ease;
  }
  .admin.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
  .admin h4 { margin: 0 0 10px; font-size: 12px; color: var(--dim); font-weight: 700; letter-spacing: 0.3px; }

  /* Connect row: username + connect button side by side */
  .connect-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .connect-row input {
    flex: 1;
    min-width: 0;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid rgba(167,139,250,0.3);
    background: rgba(255,255,255,0.05);
    color: var(--ice);
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
  }
  .connect-row input::placeholder { color: var(--dim); }
  .connect-row button {
    flex-shrink: 0;
    padding: 9px 14px;
    border-radius: 9px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 12.5px;
    background: var(--violet);
    color: white;
    transition: opacity 0.15s, transform 0.1s;
  }

  /* Action row: start / stop / reset as three compact buttons */
  .action-row { display: flex; gap: 6px; margin-bottom: 4px; }
  .action-row button {
    flex: 1;
    padding: 9px 2px;
    border-radius: 9px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 12px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .action-row button:active, .connect-row button:active { transform: scale(0.96); }
  .btn-start { background: var(--lime); color: #07050d; }
  .btn-stop { background: var(--ember); color: white; }
  .btn-reset { background: transparent; color: var(--ice); border: 1px solid rgba(237, 233, 254, 0.3) !important; }

  .config-section {
    border-top: 1px solid rgba(167,139,250,0.18);
    border-bottom: 1px solid rgba(167,139,250,0.18);
    margin: 10px 0;
    padding: 10px 0;
  }
  .config-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .config-label-row .config-label {
    font-size: 11px;
    color: var(--dim);
    font-weight: 700;
  }
  .config-save-btn {
    flex-shrink: 0;
    background: var(--gold);
    color: #07050d;
    border: none;
    border-radius: 7px;
    padding: 4px 11px;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
  }
  .config-save-btn:active { transform: scale(0.95); }
  .config-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .config-field { flex: 1; min-width: 0; margin-bottom: 8px; }
  .config-field label {
    display: block;
    font-size: 10px;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .config-field input[type="number"], .config-field input[type="text"] {
    width: 100%;
    padding: 8px 9px;
    border-radius: 8px;
    border: 1px solid rgba(167,139,250,0.3);
    background: rgba(255,255,255,0.05);
    color: var(--ice);
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
  }
  .config-field input[type="range"] {
    width: 100%;
    accent-color: var(--violet);
    height: 20px;
  }
  .gift-mode-field {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-bottom: 4px;
  }
  .gift-mode-field label {
    flex: 1;
    min-width: 105px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ice);
    cursor: pointer;
  }
  .gift-mode-field input[type="checkbox"] {
    accent-color: var(--violet);
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .admin .status { font-size: 11px; color: var(--dim); margin-top: 4px; }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .topbar { padding: calc(10px + var(--safe-t)) 10px 8px; }
    .brand { font-size: 14px; }
    .timer { font-size: 23px; }
    .round-chip { font-size: 11px; padding: 5px 12px; }
    .leaderboard { top: calc(60px + var(--safe-t)); left: 8px; width: 150px; padding: 8px 9px; }
    .leaderboard h3 { font-size: 10.5px; }
    .lb-toggle-btn { font-size: 12px; }
    .lb-row { font-size: 10.5px; gap: 5px; }
    .lb-avatar { width: 18px; height: 18px; }
    .join-hint { padding: 7px 14px; bottom: calc(14px + var(--safe-b)); }
    .join-hint .line-main { font-size: 11.5px; }
    .join-hint .line-sub { font-size: 10px; }
    .toast-stack { top: calc(54px + var(--safe-t)); }
    .toast { font-size: 11px; padding: 6px 12px; }
    .fab-toggle { width: 42px; height: 42px; font-size: 17px; right: 12px; }
    .admin { right: 12px; width: min(280px, calc(100vw - 20px)); padding: 12px; }
    .winner-avatar { width: 100px; height: 100px; }
    .winner-name { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> ساحة المعركة</div>
    <div class="round-chip" id="roundChip">الجولة 0</div>
    <div class="timer" id="timer">03:00</div>
  </div>

  <div class="leaderboard" id="leaderboardPanel">
    <h3>
      <span>الأعلى نقاطًا</span>
      <button class="lb-toggle-btn" id="lbToggleBtn" aria-label="إخفاء/إظهار قائمة المتصدرين">🏆</button>
    </h3>
    <div id="lbList"></div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <div class="arena-wrap">
    <div class="arena" id="arena"></div>
  </div>

  <div class="join-hint">
    <div class="line-main">انقر على الشاشة للدخول إلى الساحة</div>
    <div class="line-sub">إرسال الهدايا يزيد النقاط والمستوى</div>
  </div>

  <div class="winner-overlay" id="winnerOverlay">
    <div class="winner-avatar" id="winnerAvatar"></div>
    <div class="winner-title" id="winnerTitle">🏆 الفائز بالجولة</div>
    <div class="winner-name" id="winnerName"></div>
    <div class="winner-score" id="winnerScore"></div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-message" id="confirmMessage"></div>
      <div class="confirm-buttons">
        <button class="confirm-cancel" id="confirmCancelBtn">إلغاء</button>
        <button class="confirm-ok" id="confirmOkBtn">تأكيد</button>
      </div>
    </div>
  </div>

  <button class="fab-toggle" id="fabToggle" aria-label="لوحة التحكم">⚙️</button>

  <div class="admin" id="adminPanel">
    <h4>لوحة التحكم</h4>
    <div class="connect-row">
      <input id="usernameInput" placeholder="اسم المستخدم على تيك توك" />
      <button onclick="connectTikTok()">اتصال</button>
    </div>

    <div class="config-section">
      <div class="config-label-row">
        <span class="config-label">إعدادات المسابقة</span>
        <button class="config-save-btn" onclick="saveConfig()">حفظ</button>
      </div>
      <div class="config-row">
        <div class="config-field">
          <label>مدة الجولة (دقائق)</label>
          <input id="roundDurationInput" type="number" min="0.25" step="0.25" value="3" />
        </div>
        <div class="config-field">
          <label>عدد الجولات (0=غير محدود)</label>
          <input id="totalRoundsInput" type="number" min="0" step="1" value="0" />
        </div>
      </div>
    </div>

    <div class="config-section">
      <div class="config-label-row">
        <span class="config-label">إعدادات المعركة</span>
        <button class="config-save-btn" onclick="saveBattleConfig()">حفظ</button>
      </div>
      <div class="config-field">
        <label>سرعة الكرات: <span id="speedValueLabel">140</span></label>
        <input id="speedInput" type="range" min="20" max="600" step="10" value="140" oninput="document.getElementById('speedValueLabel').textContent = this.value" />
      </div>
      <div class="gift-mode-field">
        <label><input type="checkbox" id="giftLevelCheckbox" checked /> رفع المستوى</label>
        <label><input type="checkbox" id="giftShotsCheckbox" checked /> طلقات متتالية</label>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-start" onclick="startGame()">بدء</button>
      <button class="btn-stop" onclick="stopGame()">إيقاف</button>
      <button class="btn-reset" onclick="resetGame()">تصفير</button>
    </div>
    <div class="status" id="statusLine">غير متصل</div>
  </div>
</div>

<script>
// Each browser keeps its own persistent session id (localStorage), so this
// same deployed page can run fully independent games — different TikTok
// accounts, separate arenas — on multiple devices/browsers at once. Every
// admin action and the socket connection itself are scoped to this id.
function getSessionId() {
  const KEY = 'battleArenaSessionId';
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'sess-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
    localStorage.setItem(KEY, id);
  }
  return id;
}
const SESSION_ID = getSessionId();

const socket = io({ query: { sessionId: SESSION_ID } });
const arena = document.getElementById('arena');
const timerEl = document.getElementById('timer');
const roundChip = document.getElementById('roundChip');
const lbList = document.getElementById('lbList');
const statusLine = document.getElementById('statusLine');
const winnerOverlay = document.getElementById('winnerOverlay');
const toastStack = document.getElementById('toastStack');
const adminPanel = document.getElementById('adminPanel');
const fabToggle = document.getElementById('fabToggle');

const ARENA_RADIUS = 500; // must match server virtual units
let arenaPx = arena.clientWidth / 2;
window.addEventListener('resize', () => arenaPx = arena.clientWidth / 2);

const bubbleEls = new Map();
let roundEndsAt = 0;
let totalRounds = 0;
let roundDurationMs = 3 * 60 * 1000;
let currentMaxSpeed = 140;
let currentGiftMode = { level: true, shots: true };

function toPx(v) { return (v / ARENA_RADIUS) * arenaPx; }

// ---------- Audio (procedural, no external files) ----------
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
function playTone(freq, duration, type, gainPeak, delay) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  delay = delay || 0;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
  gain.gain.setValueAtTime(0, ctx.currentTime + delay);
  gain.gain.linearRampToValueAtTime(gainPeak || 0.15, ctx.currentTime + delay + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration + 0.03);
}
let lastHitSoundAt = 0;
function playHitSound(heavy) {
  const now = Date.now();
  if (now - lastHitSoundAt < 70) return;
  lastHitSoundAt = now;
  if (heavy) {
    playTone(130, 0.28, 'sawtooth', 0.22, 0);
    playTone(85, 0.32, 'square', 0.16, 0.02);
  } else {
    playTone(240, 0.07, 'square', 0.07, 0);
  }
}
function playLevelUpSound() {
  playTone(440, 0.12, 'triangle', 0.16, 0);
  playTone(660, 0.12, 'triangle', 0.16, 0.09);
  playTone(880, 0.2, 'triangle', 0.19, 0.18);
}

// ---------- Toasts ----------
function showToast(message, cls) {
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.textContent = message;
  toastStack.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ---------- Bubble avatar fallback color ----------
function colorForName(name) {
  const palette = ['#7c3aed', '#c9376a', '#1f8a70', '#b8860b', '#2a6f97', '#9d4edd'];
  let hash = 0;
  const str = name || '?';
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return palette[hash % palette.length];
}

// ---------- Spike ring (rank tiers) — metallic saw-blade look ----------
function sanitizeId(str) {
  return String(str).replace(/[^a-zA-Z0-9_-]/g, '') || 'x';
}

function buildSpikeSVG(bubbleRadiusPx, spikeCount, color, uid) {
  const gradId = 'bladeGrad_' + uid;
  const toothLenLong = Math.max(9, bubbleRadiusPx * 0.46);
  const toothLenShort = toothLenLong * 0.52;
  const outer = bubbleRadiusPx + toothLenLong;
  const size = outer * 2;
  const cx = outer, cy = outer;
  let teeth = '';
  for (let i = 0; i < spikeCount; i++) {
    const angle = (i / spikeCount) * Math.PI * 2;
    const len = (i % 2 === 0) ? toothLenLong : toothLenShort;
    const toothOuter = bubbleRadiusPx + len;
    const halfBase = (Math.PI / spikeCount) * 0.42;
    // Asymmetric hook: the tip leans toward the leading edge, like a real
    // saw tooth, instead of a plain isoceles thorn.
    const tipAngle = angle + halfBase * 0.35;
    const tipX = cx + Math.cos(tipAngle) * toothOuter;
    const tipY = cy + Math.sin(tipAngle) * toothOuter;
    const b1x = cx + Math.cos(angle - halfBase) * bubbleRadiusPx;
    const b1y = cy + Math.sin(angle - halfBase) * bubbleRadiusPx;
    const b2x = cx + Math.cos(angle + halfBase) * bubbleRadiusPx;
    const b2y = cy + Math.sin(angle + halfBase) * bubbleRadiusPx;
    teeth += '<polygon points="' + tipX + ',' + tipY + ' ' + b1x + ',' + b1y + ' ' + b2x + ',' + b2y +
      '" fill="url(#' + gradId + ')" stroke="' + color + '" stroke-width="1" stroke-linejoin="round"/>';
  }
  const collar = '<circle cx="' + cx + '" cy="' + cy + '" r="' + (bubbleRadiusPx * 0.95) +
    '" fill="none" stroke="' + color + '" stroke-width="2.5" opacity="0.9"/>';
  const collarInner = '<circle cx="' + cx + '" cy="' + cy + '" r="' + (bubbleRadiusPx * 0.86) +
    '" fill="none" stroke="' + color + '" stroke-width="1" opacity="0.45"/>';
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size +
    '" style="filter:drop-shadow(0 0 6px ' + color + ')">' +
    '<defs><linearGradient id="' + gradId + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
      '<stop offset="0%" stop-color="#f1f1f6"/>' +
      '<stop offset="45%" stop-color="#9a9aa8"/>' +
      '<stop offset="100%" stop-color="#45454f"/>' +
    '</linearGradient></defs>' +
    teeth + collar + collarInner +
  '</svg>';
}

// The blade's visibility follows tap activity (player.tapping), not rank —
// it's a "power surge" while actively tapping, fading a few seconds after
// activity stops. Its color/spike-count still reflect rank when the player
// has one, falling back to a neutral energetic color for unranked tappers.
const DEFAULT_BLADE_COLOR = '#67e8f9';
const DEFAULT_BLADE_SPIKES = 10;

function updateSpikes(el, player, sizePx) {
  const layer = el.querySelector('.spike-layer');
  const color = player.rankColor || DEFAULT_BLADE_COLOR;
  const spikes = player.rankSpikes || DEFAULT_BLADE_SPIKES;
  const styleKey = (player.rankId || 'default') + ':' + Math.round(sizePx);
  if (layer.dataset.style !== styleKey) {
    layer.dataset.style = styleKey;
    layer.innerHTML = buildSpikeSVG(sizePx / 2, spikes, color, sanitizeId(player.userId));
  }
  layer.classList.toggle('visible', !!player.tapping);
}


function ensureBubbleEl(player) {
  let el = bubbleEls.get(player.userId);
  if (!el) {
    el = document.createElement('div');
    el.className = 'bubble';
    el.innerHTML =
      '<div class="spike-layer"></div>' +
      '<div class="score-tag"></div>' +
      '<div class="name-tag"><span class="name-text"></span><span class="attack-level"></span><span class="kills"></span></div>' +
      '<div class="badge"></div>' +
      '<div class="initial"></div>';
    arena.appendChild(el);
    bubbleEls.set(player.userId, el);
  }
  return el;
}

function renderState(state) {
  roundChip.textContent = state.totalRounds > 0
    ? 'الجولة ' + state.roundNumber + ' من ' + state.totalRounds
    : 'الجولة ' + state.roundNumber;
  roundEndsAt = state.roundEndsAt;
  totalRounds = state.totalRounds || 0;
  if (state.roundDurationMs) roundDurationMs = state.roundDurationMs;
  if (state.maxSpeed) currentMaxSpeed = state.maxSpeed;
  if (state.giftMode) currentGiftMode = state.giftMode;
  syncConfigInputs();

  const seen = new Set();
  state.players.forEach((p) => {
    seen.add(p.userId);
    const el = ensureBubbleEl(p);
    const cx = arenaPx + toPx(p.x);
    const cy = arenaPx + toPx(p.y);
    const size = toPx(p.radius) * 2;
    el.style.left = cx + 'px';
    el.style.top = cy + 'px';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.backgroundImage = p.profilePictureUrl ? "url('" + p.profilePictureUrl + "')" : 'none';
    el.style.backgroundColor = p.profilePictureUrl ? 'transparent' : colorForName(p.nickname);
    el.style.borderColor = p.rankColor || 'var(--violet-glow)';
    el.querySelector('.score-tag').textContent = p.roundScore;
    el.querySelector('.name-text').textContent = p.nickname || '';
    el.querySelector('.attack-level').textContent = p.attackLevel > 0 ? ('⚔' + p.attackLevel) : '';
    el.querySelector('.kills').textContent = p.kills > 0 ? ('💀' + p.kills) : '';
    el.querySelector('.badge').textContent = p.rankLabel || '';
    const initialEl = el.querySelector('.initial');
    initialEl.textContent = p.profilePictureUrl ? '' : (p.nickname || '?').trim().charAt(0).toUpperCase();
    updateSpikes(el, p, size);
  });

  // remove stale bubbles (that weren't explicitly eliminated, e.g. after a reconnect)
  for (const [userId, el] of bubbleEls.entries()) {
    if (!seen.has(userId)) {
      el.remove();
      bubbleEls.delete(userId);
    }
  }

  lbList.innerHTML = state.players.slice(0, 5).map((p, i) => {
    const avatarStyle = p.profilePictureUrl
      ? "background-image:url('" + p.profilePictureUrl + "')"
      : 'background-color:' + colorForName(p.nickname);
    const initial = p.profilePictureUrl ? '' : '<span class="lb-initial">' + (p.nickname || '?').trim().charAt(0).toUpperCase() + '</span>';
    return '<div class="lb-row">' +
      '<div class="lb-rank">' + (i + 1) + '</div>' +
      '<div class="lb-avatar" style="' + avatarStyle + '">' + initial + '</div>' +
      '<div class="lb-name">' + (p.nickname || '') + '</div>' +
      '<div class="lb-score">' + p.roundScore + '</div>' +
    '</div>';
  }).join('');
}

function spawnFloatNum(userId, amount, isPlus) {
  const el = bubbleEls.get(userId);
  if (!el) return;
  const f = document.createElement('div');
  f.className = 'float-num ' + (isPlus ? 'plus' : 'minus');
  f.textContent = (isPlus ? '+' : '-') + Math.abs(amount);
  f.style.left = el.style.left;
  f.style.top = el.style.top;
  arena.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

function arenaPoint(x, y) {
  return { left: arenaPx + toPx(x), top: arenaPx + toPx(y) };
}

function spawnProjectile(from, to) {
  const start = arenaPoint(from.x, from.y);
  const end = arenaPoint(to.x, to.y);
  const p = document.createElement('div');
  p.className = 'projectile';
  p.style.left = start.left + 'px';
  p.style.top = start.top + 'px';
  arena.appendChild(p);
  requestAnimationFrame(() => {
    p.style.transition = 'left 0.35s ease-in, top 0.35s ease-in';
    p.style.left = end.left + 'px';
    p.style.top = end.top + 'px';
  });
  setTimeout(() => {
    p.remove();
    spawnImpactFlash(end.left, end.top);
  }, 360);
}

function spawnImpactFlash(left, top) {
  const f = document.createElement('div');
  f.className = 'impact-flash';
  f.style.left = left + 'px';
  f.style.top = top + 'px';
  arena.appendChild(f);
  setTimeout(() => f.remove(), 420);
}

socket.on('state', renderState);

socket.on('event', (evt) => {
  if (evt.type === 'like') spawnFloatNum(evt.userId, evt.amount, true);
  if (evt.type === 'hit') {
    spawnFloatNum(evt.toUserId, evt.amount, false);
    playHitSound(false);
  }
});

socket.on('gift:attack', (data) => {
  // The level-up toast/sound now live on the separate gift:levelup event
  // (fired once per gift, independent of how many barrage shots follow) —
  // this handler is purely the projectile visual for each shot.
  if (data.to) spawnProjectile(data.from, data.to);
});

socket.on('gift:levelup', (data) => {
  showToast('⚔ قام ' + (data.from.nickname || '') + ' برفع مستوى الهجوم إلى ' + data.attackLevel, 'level');
  playLevelUpSound();
});

socket.on('player:eliminated', (data) => {
  const el = bubbleEls.get(data.victim.userId);
  if (el) {
    el.classList.add('eliminated');
    setTimeout(() => { el.remove(); bubbleEls.delete(data.victim.userId); }, 480);
  }
  const killerName = data.killer ? data.killer.nickname : null;
  showToast(killerName ? ('⚔ ' + killerName + ' أقصى ' + data.victim.nickname) : (data.victim.nickname + ' خرج من المعركة'), 'kill');
  playHitSound(true);
});

socket.on('round:end', (data) => {
  const titleEl = document.getElementById('winnerTitle');
  if (data.winner) {
    document.getElementById('winnerAvatar').style.backgroundImage = "url('" + (data.winner.profilePictureUrl || '') + "')";
    document.getElementById('winnerAvatar').style.backgroundColor = data.winner.profilePictureUrl ? 'transparent' : colorForName(data.winner.nickname);
    document.getElementById('winnerName').textContent = data.winner.nickname || '';
    document.getElementById('winnerScore').textContent = data.winner.roundScore + ' نقطة';
  } else if (data.competitionComplete) {
    document.getElementById('winnerAvatar').style.backgroundImage = 'none';
    document.getElementById('winnerAvatar').style.backgroundColor = 'transparent';
    document.getElementById('winnerName').textContent = '';
    document.getElementById('winnerScore').textContent = '';
  } else {
    return; // no winner and the competition isn't over -> nothing worth showing
  }
  titleEl.textContent = data.competitionComplete ? '🏁 انتهت المسابقة' : '🏆 الفائز بالجولة';
  winnerOverlay.classList.add('show');
  if (!data.competitionComplete) {
    setTimeout(() => winnerOverlay.classList.remove('show'), 4500);
  }
  // when competitionComplete, the overlay stays up until a new round starts
});

socket.on('round:start', () => {
  winnerOverlay.classList.remove('show');
});

socket.on('tiktok:connected', (d) => {
  statusLine.textContent = 'متصل بـ @' + d.username;
  // Extra client-side safety net: clear any stale bubbles immediately when
  // switching accounts, ahead of the next state broadcast.
  for (const el of bubbleEls.values()) el.remove();
  bubbleEls.clear();
});
socket.on('tiktok:disconnected', () => { statusLine.textContent = 'انقطع الاتصال'; });
socket.on('tiktok:error', (d) => { statusLine.textContent = 'خطأ: ' + d.message; });

// countdown timer
setInterval(() => {
  if (!roundEndsAt) {
    timerEl.textContent = '00:00';
    timerEl.classList.remove('urgent');
    return;
  }
  const remaining = Math.max(0, roundEndsAt - Date.now());
  const mm = String(Math.floor(remaining / 60000)).padStart(2, '0');
  const ss = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
  timerEl.textContent = mm + ':' + ss;
  timerEl.classList.toggle('urgent', remaining < 30000);
}, 250);

// ---------- Admin panel toggle ----------
fabToggle.addEventListener('click', () => {
  getAudioCtx(); // unlock audio on first user gesture
  adminPanel.classList.toggle('open');
});

// ---------- Leaderboard toggle ----------
const leaderboardPanel = document.getElementById('leaderboardPanel');
document.getElementById('lbToggleBtn').addEventListener('click', () => {
  leaderboardPanel.classList.toggle('collapsed');
});

// ---------- Admin actions ----------
function connectTikTok() {
  getAudioCtx();
  const username = document.getElementById('usernameInput').value.trim();
  if (!username) return;
  fetch('/api/connect', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: SESSION_ID, username }),
  });
}
function startGame() {
  getAudioCtx();
  fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: SESSION_ID }) });
}
function stopGame() {
  getAudioCtx();
  fetch('/api/stop', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: SESSION_ID }) });
}
function resetGame() {
  getAudioCtx();
  showConfirm('هذا سيمسح كل اللاعبين من الساحة الحالية. متأكد؟', () => {
    fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessionId: SESSION_ID }) });
  });
}

// Custom in-app confirm dialog — the native browser confirm() displays the
// raw hosting domain and can't be styled, which looks out of place over a
// live stream overlay. Shows `message`, then calls `onConfirm` only if the
// user picks the confirm button; picking cancel (or closing) does nothing.
function showConfirm(message, onConfirm) {
  const overlay = document.getElementById('confirmOverlay');
  const okBtn = document.getElementById('confirmOkBtn');
  const cancelBtn = document.getElementById('confirmCancelBtn');
  document.getElementById('confirmMessage').textContent = message;
  overlay.classList.add('show');

  function cleanup() {
    overlay.classList.remove('show');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', onCancel);
  }
  function onOk() { cleanup(); onConfirm(); }
  function onCancel() { cleanup(); }

  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
}

function saveConfig() {
  getAudioCtx();
  const roundDurationMinutes = parseFloat(document.getElementById('roundDurationInput').value);
  const totalRoundsValue = parseInt(document.getElementById('totalRoundsInput').value, 10);
  fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      sessionId: SESSION_ID,
      roundDurationMinutes: Number.isFinite(roundDurationMinutes) ? roundDurationMinutes : undefined,
      totalRounds: Number.isFinite(totalRoundsValue) ? totalRoundsValue : undefined,
    }),
  });
}

function saveBattleConfig() {
  getAudioCtx();
  const speed = parseInt(document.getElementById('speedInput').value, 10);
  const giftLevel = document.getElementById('giftLevelCheckbox').checked;
  const giftShots = document.getElementById('giftShotsCheckbox').checked;
  fetch('/api/config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      sessionId: SESSION_ID,
      maxSpeed: Number.isFinite(speed) ? speed : undefined,
      giftMode: { level: giftLevel, shots: giftShots },
    }),
  });
}

// Keeps the settings inputs showing the server's actual current config
// (e.g. after a page reload), without clobbering an in-progress edit.
function syncConfigInputs() {
  const durationInput = document.getElementById('roundDurationInput');
  const roundsInput = document.getElementById('totalRoundsInput');
  const speedInput = document.getElementById('speedInput');
  const speedLabel = document.getElementById('speedValueLabel');
  const giftLevelCheckbox = document.getElementById('giftLevelCheckbox');
  const giftShotsCheckbox = document.getElementById('giftShotsCheckbox');

  if (document.activeElement !== durationInput) {
    durationInput.value = Math.round((roundDurationMs / 60000) * 100) / 100;
  }
  if (document.activeElement !== roundsInput) {
    roundsInput.value = totalRounds;
  }
  if (document.activeElement !== speedInput) {
    speedInput.value = currentMaxSpeed;
    speedLabel.textContent = currentMaxSpeed;
  }
  if (document.activeElement !== giftLevelCheckbox) {
    giftLevelCheckbox.checked = currentGiftMode.level !== false;
  }
  if (document.activeElement !== giftShotsCheckbox) {
    giftShotsCheckbox.checked = currentGiftMode.shots !== false;
  }
}
</script>
</body>
</html>
